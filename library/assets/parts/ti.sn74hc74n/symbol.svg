<title id="title">SN74HC74N dual D flip-flop pin-map symbol</title>
<desc id="description">Original educational schematic symbol showing two ideal D flip-flop sections and the TI SN74HC74N signal-to-package-pin map. It does not imply a manufacturer-specific simulation model.</desc>
<style>text{font:12px Arial,sans-serif;fill:#111}.wire{stroke:#111;stroke-width:2;fill:none}.body{fill:#fff;stroke:#111;stroke-width:2}.heading{font-weight:bold;font-size:15px}.pin{font-size:11px}.number{font-size:10px;fill:#555}</style>
<rect class="body" x="165" y="28" width="220" height="92" rx="4"/><text class="heading" x="275" y="54" text-anchor="middle">SN74HC74N</text><text x="275" y="77" text-anchor="middle">1D positive-edge D flip-flop</text><text x="275" y="99" text-anchor="middle">asynchronous PRE / CLR</text>
<rect class="body" x="165" y="162" width="220" height="92" rx="4"/><text class="heading" x="275" y="188" text-anchor="middle">Second D flip-flop</text><text x="275" y="211" text-anchor="middle">positive-edge D input</text><text x="275" y="233" text-anchor="middle">asynchronous PRE / CLR</text>
<path class="wire" data-pin="1" d="M95 42H165"/><path class="wire" data-pin="2" d="M95 63H165"/><path class="wire" data-pin="3" d="M95 84H165"/><path class="wire" data-pin="4" d="M95 105H165"/>
<path class="wire" data-pin="5" d="M385 58H455"/><path class="wire" data-pin="6" d="M385 90H455"/><path class="wire" data-pin="7" d="M275 254V284"/><path class="wire" data-pin="8" d="M385 226H455"/><path class="wire" data-pin="9" d="M385 194H455"/><path class="wire" data-pin="10" d="M95 239H165"/><path class="wire" data-pin="11" d="M95 218H165"/><path class="wire" data-pin="12" d="M95 197H165"/><path class="wire" data-pin="13" d="M95 176H165"/><path class="wire" data-pin="14" d="M275 0V28"/>
<text class="number" x="12" y="39">1</text><text class="pin" x="28" y="46">1CLR</text><text class="number" x="12" y="60">2</text><text class="pin" x="28" y="67">1D</text><text class="number" x="12" y="81">3</text><text class="pin" x="28" y="88">1CLK</text><text class="number" x="12" y="102">4</text><text class="pin" x="28" y="109">1PRE</text>
<text class="number" x="462" y="55">5</text><text class="pin" x="478" y="62">1Q</text><text class="number" x="462" y="87">6</text><text class="pin" x="478" y="94">1QBAR</text>

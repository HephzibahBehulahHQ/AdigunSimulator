name: Build AVR example firmware

on:
  push:
    branches: [main]
    paths:
      - 'examples/049-traffic-light-fsm/main.c'
      - 'examples/050-debounced-digital-input/main.c'
      - 'examples/055-alu-add-subtract/main.c'
      - 'examples/056-uart-transmitter/main.c'
      - 'examples/057-uart-receiver/main.c'
      - 'examples/059-spi-display/main.c'
      - 'examples/061-arduino-blink/main.c'
      - 'examples/062-arduino-button-debounce/main.c'
      - 'examples/063-arduino-pwm-dimmer/main.c'
      - 'examples/064-arduino-temperature-monitor/main.c'
      - 'examples/065-arduino-ultrasonic-ranger/main.c'
      - 'examples/066-arduino-servo-control/main.c'
      - '.github/workflows/avr-example-firmware.yml'
  pull_request:
    paths:
      - 'examples/049-traffic-light-fsm/main.c'
      - 'examples/050-debounced-digital-input/main.c'
      - 'examples/055-alu-add-subtract/main.c'
      - 'examples/056-uart-transmitter/main.c'
      - 'examples/057-uart-receiver/main.c'
      - 'examples/059-spi-display/main.c'
      - 'examples/061-arduino-blink/main.c'
      - 'examples/062-arduino-button-debounce/main.c'
      - 'examples/063-arduino-pwm-dimmer/main.c'
      - 'examples/064-arduino-temperature-monitor/main.c'
      - 'examples/065-arduino-ultrasonic-ranger/main.c'
      - 'examples/066-arduino-servo-control/main.c'
      - '.github/workflows/avr-example-firmware.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install missing AVR build tools
        run: |
          if ! command -v avr-gcc >/dev/null || ! command -v avr-objcopy >/dev/null ||
            ! printf '#include <avr/io.h>\n' | avr-gcc -mmcu=atmega328p -x c -fsyntax-only -; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gcc-avr binutils-avr avr-libc
          fi
      - name: Build the ATmega328P examples
        run: |
          avr-gcc --version
          for example in 049-traffic-light-fsm 050-debounced-digital-input 055-alu-add-subtract 056-uart-transmitter 057-uart-receiver 059-spi-display 061-arduino-blink 062-arduino-button-debounce 063-arduino-pwm-dimmer 064-arduino-temperature-monitor 065-arduino-ultrasonic-ranger 066-arduino-servo-control; do
            avr-gcc -mmcu=atmega328p -std=c11 -Os -Wall -Wextra -Werror \
              "examples/$example/main.c" -o "$RUNNER_TEMP/$example.elf"
            avr-objcopy -O ihex -R .eeprom "$RUNNER_TEMP/$example.elf" "$RUNNER_TEMP/$example.hex"
            test -s "$RUNNER_TEMP/$example.hex"
          done

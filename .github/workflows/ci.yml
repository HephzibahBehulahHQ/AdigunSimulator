name: Verify AdigunSimulator

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate:library
      - run: npm test
      - run: npm run check
      - name: Build committed static site
        run: npm run build -- "$RUNNER_TEMP/adigun-pages"
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/adigun-pages

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified static site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  deploy-cloudflare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: adigunsimulator-cloudflare-production
      cancel-in-progress: false
    environment:
      name: cloudflare-production
      url: https://adigunsimulator.hephzibahbehulah.com/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build committed Worker assets
        run: npm run build -- dist
      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$(git ls-remote origin refs/heads/main | cut -f 1)" != "$GITHUB_SHA" ]; then
            echo "::error::This workflow revision is no longer the tip of main."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure the Cloudflare API token and account ID in cloudflare-production."
            exit 1
          fi
          npm exec --yes --package=wrangler@4.124.0 -- wrangler deploy --config wrangler.account-preview.toml --env production --keep-vars
      - name: Verify production release
        run: node scripts/verify-cloudflare-release.mjs

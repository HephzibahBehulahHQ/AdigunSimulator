name: Qualify pinned ngspice native build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/ngspice-qualification.yml
      - js/core.mjs
      - js/spice-netlist.mjs
      - scripts/generate-spice-current-source-smoke.mjs
      - tests/ngspice/native-smoke.c
      - tests/ngspice/resistor-divider.cir
  push:
    paths:
      - .github/workflows/ngspice-qualification.yml
      - js/core.mjs
      - js/spice-netlist.mjs
      - scripts/generate-spice-current-source-smoke.mjs
      - tests/ngspice/native-smoke.c
      - tests/ngspice/resistor-divider.cir

permissions:
  contents: read

jobs:
  native-shared-library:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate current-source smoke deck with the app exporter
        run: node scripts/generate-spice-current-source-smoke.mjs "$RUNNER_TEMP/exported-current-source.cir"

      - name: Install upstream build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y autoconf automake bison build-essential flex libtool

      - name: Fetch and verify the reviewed ngspice revision
        env:
          NGSPICE_COMMIT: a80f6e3e95d51534905b1f23410a951802666656
        run: |
          git init ngspice
          git -C ngspice remote add origin https://git.code.sf.net/p/ngspice/ngspice
          git -C ngspice fetch --depth=1 origin "$NGSPICE_COMMIT"
          git -C ngspice checkout --detach FETCH_HEAD
          test "$(git -C ngspice rev-parse HEAD)" = "$NGSPICE_COMMIT"

      - name: Build the upstream shared library without installing or publishing it
        working-directory: ngspice
        run: |
          ./autogen.sh
          mkdir build
          cd build
          ../configure --with-ngshared --enable-cider --prefix="$RUNNER_TEMP/ngspice-install"
          make -j2
          NGSPICE_LIBRARY="$(find . -type f -path '*/.libs/libngspice.so*' -print -quit)"
          test -n "$NGSPICE_LIBRARY"
          NGSPICE_LIBRARY_DIR="$(dirname "$NGSPICE_LIBRARY")"
          cc -I "$GITHUB_WORKSPACE/ngspice/src/include" \
            "$GITHUB_WORKSPACE/tests/ngspice/native-smoke.c" \
            -L "$NGSPICE_LIBRARY_DIR" -Wl,-rpath,"$NGSPICE_LIBRARY_DIR" \
            -lngspice -lm -o "$RUNNER_TEMP/ngspice-native-smoke"
          "$RUNNER_TEMP/ngspice-native-smoke" \
            "$GITHUB_WORKSPACE/tests/ngspice/resistor-divider.cir" "v(out)" 5
          "$RUNNER_TEMP/ngspice-native-smoke" \
            "$RUNNER_TEMP/exported-current-source.cir" "v(n1)" 10


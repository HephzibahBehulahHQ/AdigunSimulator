name = "adigun-simulator-account-preview"
main = "cloudflare/product-worker.mjs"
compatibility_date = "2026-11-22"
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/account"]

[[ratelimits]]
name = "ACCOUNT_LIMITER"
namespace_id = "55"
simple = { limit = 10, period = 60 }

[env.production]
name = "adigun-simulator-product"
workers_dev = false
preview_urls = false
routes = [{ pattern = "adigunsimulator.hephzibahbehulah.com/*", zone_name = "hephzibahbehulah.com" }]

[env.production.vars]
SUPABASE_URL = "https://vnckoocsookbaqalybje.supabase.co"

[env.production.assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/account"]

[[env.production.ratelimits]]
name = "ACCOUNT_LIMITER"
namespace_id = "56"
simple = { limit = 10, period = 60 }

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B1220" />
    <meta name="description" content="AdigunSimulator local-first electrical and electronics design workspace." />
    <title>AdigunSimulator — HB Elektroniker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#workspace" data-i18n="skipToWorkspace">Skip to workspace</a>
    <header class="identity-header">
      <div class="identity">
        <div class="corporate-brand">
        <img class="corporate-logo" src="assets/brand/hephzibah-behulah-official.jpg" alt="Official Hephzibah Behulah corporate logo" data-i18n-alt="corporateLogoAlt" />
          <div class="corporate-wordmark"><strong>Hephzibah Behulah</strong><span>GLOBAL</span></div>
        </div>
        <div class="identity-divider" aria-hidden="true"></div>
        <div class="division-brand"><strong>HB Elektroniker</strong><small data-i18n="divisionTagline">Electrical · Automation · Training</small></div>
        <div class="identity-divider" aria-hidden="true"></div>
        <div class="product-brand">
          <h1>Adigun<span>Simulator</span></h1>
          <p data-i18n="productTagline">Design · Analyze · Prototype</p>
        </div>
      </div>
      <div class="header-actions" aria-label="Account and application controls">
        <span class="save-state saved" id="save-state" aria-live="polite">Empty project</span>
        <span id="account-status" class="icon-button account-button" role="img" data-auth-state="guest" aria-label="Account: guest; sign-in is unavailable" title="Account · Guest (sign-in unavailable)" data-i18n-aria="accountGuestAria" data-i18n-title="accountGuestTooltip">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 19c.5-3.1 2.8-5 6.5-5s6 1.9 6.5 5"/></svg><span class="account-status-dot" aria-hidden="true"></span>
        </span>
        <label class="language-control" title="Language" data-i18n-title="locale"><span class="sr-only">Language</span><select id="language" aria-label="Language" title="Language" data-i18n-aria="locale"><option value="en">EN</option><option value="de">DE</option><option value="yo">YO</option><option value="pcm">PCM</option></select></label>
        <button id="theme-toggle" class="icon-button" type="button" aria-label="Switch colour theme" title="Switch colour theme" data-i18n-aria="theme" data-i18n-title="theme">⚙</button>
        <button id="global-search-toggle" class="icon-button" type="button" aria-label="Show search" title="Show search" aria-controls="global-search" aria-expanded="false" aria-keyshortcuts="Control+k Meta+k" data-i18n-aria="searchGlobal" data-i18n-title="searchGlobal"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.5"/><path d="m16 16 5 5"/></svg></button>
        <label class="global-search" hidden><span aria-hidden="true">⌕</span><input id="global-search" type="search" list="global-search-actions" aria-label="Search components, tools, or help" data-i18n-aria="searchGlobal" placeholder="Search components, tools, or help…" data-i18n-placeholder="searchGlobal" /><datalist id="global-search-actions"></datalist></label>
        <button id="help-button" class="icon-button" type="button" aria-label="Open implementation status" title="Open implementation status" data-global-search-terms="help status" data-i18n-aria="help" data-i18n-title="help">?</button>
      </div>
    </header>

    <nav class="command-bar" aria-label="Application commands">
      <div class="menu-buttons" aria-label="Application menus">
        <details class="app-menu" name="application-menu"><summary data-i18n="fileMenu">File</summary><div class="app-menu-popover">
          <button type="button" data-action="new-project" data-i18n="newProject">New Project</button>
          <button type="button" data-action="import-project" data-i18n="open">Open</button>
          <button type="button" data-action="open-recent-project" data-i18n="openRecentProject">Open Recent…</button>
          <button type="button" data-action="open-saved-project" data-i18n="openSavedProject">Open saved project</button>
          <button type="button" data-action="close-project" data-i18n="closeProject">Close Project</button>
          <button type="button" data-action="save" data-i18n="save">Save</button>
          <button type="button" data-action="export" data-editor-label="saveAs">Save as file…</button>
          <button type="button" data-action="print-project" data-editor-label="print">Print current view…</button>
          <button type="button" data-action="bom-export" data-i18n="exportBomCsv">Export BOM CSV</button>
        </div></details>
        <details class="app-menu" data-menu-dismiss="form" name="application-menu"><summary
